# =============================================================================
# Clause Category Registry — CUAD (41) + MAUD (8)
# =============================================================================
# Purpose: structured extraction target for ContractsSpecialist, replacing the
# current fixed 8-field schema with per-category {present, clause_text} pairs.
#
# PROVENANCE (KANBAN-072 reconciliation, 2026-08-24):
#   - Every CUAD-category verbatim_question below is now CHARACTER-EXACT vs the
#     primary source:
#       https://github.com/The-Atticus-Project/cuad/blob/main/category_descriptions.csv
#     fetched 2026-08-24, sha256 7499950ee04d2ed2841c0f8ec2ef96b91be039bc2ea3c4edcc36334a465b1f36.
#     History: the previous texts (incl. those quoted in issue #25) were fluent
#     paraphrases that deviated substantively from the canonical wording in ~30 of
#     41 categories while carrying a "verbatim" label — e.g. volume_restriction's
#     old text actually described price_increase_consent. All such drift is gone.
#   - answer_type now follows the canonical per-category `Answer Format` column:
#     Yes/No -> yes_no, anything else -> general_info (canonical file shows 9
#     non-Yes/No CUAD formats; the datasheet prose rounds this to 8).
#   - MAUD categories keep their #25-sourced question text, honestly tagged:
#     not yet reconciled against the official MAUD v1 query files.
#   - applicable_doc_classes remains "all" pending real category-presence stats.
# =============================================================================

categories:

