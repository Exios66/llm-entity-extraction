# ---------------------------------------------------------------------------
# Agent inquiry templates (issue #25, verbatim) — dynamic per-inquiry prompt
# routing for the contracts specialist across both benchmarks.
# ---------------------------------------------------------------------------
agent_inquiry_templates:
  change_of_control:
    prompt: 'Extract all verbatim clauses specifying whether a merger, equity sale, or change of control requires counterparty consent or triggers termination rights. If absent, return ''no related clause''.'
    target_dataset: "CUAD"
  mae_clause_scope:
    prompt: 'Analyze the Material Adverse Effect (MAE/MAC) clause. Extract the core definition, all standard exclusions (e.g., industry-wide shifts, macroeconomic updates), and any custom carve-outs.'
    target_dataset: "MAUD"
  contract_amendment_restrictions:
    prompt: 'Identify all provisions governing contract modifications, written amendment requirements, price escalation caps, or interim operating covenants during a corporate transaction.'
    target_dataset: "CUAD / MAUD"
