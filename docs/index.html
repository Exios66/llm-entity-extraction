<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Experiment log viewer for llm-entity-extraction — sorter, contracts-specialist, and subtype prompt-eval results.">
  <title>llm-entity-extraction · Experiment Log</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232456d6'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='monospace'>E</text></svg>">
  <link rel="stylesheet" href="assets/site.css">
  <script>
    /* Theme before first paint: localStorage wins, else system preference.
       Override with ?theme=light|dark for testing/shareable links. */
    (function () {
      var t = null;
      try { t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1><span class="mono grad">llm-entity-extraction</span> · experiment log</h1>
      <span class="sub">prompt-eval results for the llm-mailroom pipeline</span>
      <nav class="nav">
        <a href="#/">runs</a>
        <a href="#/task/contract_entity_extraction">extraction</a>
        <a href="#/task/chained_sorter_extractor">chained</a>
        <a href="#/task/subtype_classification">subtype</a>
        <a href="https://github.com/Exios66/llm-entity-extraction" target="_blank" rel="noopener">repo</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      </nav>
    </div>
  </header>
  <main id="view"></main>
  <footer>
    <div class="divider">
      <span id="build-time"></span>
      <a href="https://github.com/Exios66/llm-entity-extraction" target="_blank" rel="noopener">github.com/Exios66/llm-entity-extraction</a> ·
      site data derived from <span class="mono">reports/experiment_log.jsonl</span> by
      <span class="mono">scripts/site/build_site.py</span> — never hand-edited.
    </div>
  </footer>
  <script src="assets/site.js"></script>
</body>
</html>
